# =====================================================================
#                        Stone Chat - config.yml
#                        A plugin by Stone Plugins
# =====================================================================
#
# This file contains SETTINGS ONLY (switches, colors, times, sounds,
# channels). All player-facing TEXT lives in messages.yml instead, per
# language, under plugins/Stone Chat/languages/<language>/messages.yml.
#
# Several features below have a "notification-type" option. It picks
# WHERE that specific message is shown - CHAT, ACTIONBAR or TITLE - and
# messages.yml already contains ready-made text for all three channels,
# so you can switch anytime without writing new text.
#
# Missing options are added automatically on plugin updates. Existing
# values you changed are never overwritten, even in nested sections.
# =====================================================================
config-version: 1

general:
  # Default language used for a fresh install. Existing installs keep their chosen language.
  # Available: en, de (folder name under languages/)
  default-language: en

# Stone Chat always removes the vanilla "X joined/left the game" message.
# Joins and leaves are completely silent - no message is sent at all.

word-filter:
  enabled: true
  # Words are matched case-insensitively as whole words
  filtered-words:
    - "badword1"
    - "badword2"
  # block = message is cancelled completely, censor = matched word is replaced with asterisks
  action: block
  notify-admins: true
  # Catches players trying to sneak a forbidden word past the filter using
  # unicode tricks: invisible characters inserted between letters, look-alike
  # letters from other alphabets (Cyrillic а, Greek α, fullwidth Ａ, ...), or
  # accented characters (café -> cafe). The word is still matched even though
  # it looks different to a human. Virtually no false-positive risk, on by default.
  evasion-detection:
    enabled: true
    # Also folds common leetspeak substitutions (4->a, 3->e, 1->i, 0->o, 5->s,
    # $->s, @->a, 7->t, +->t) into the check. Off by default since this has a
    # higher chance of false positives (e.g. usernames or numbers in normal chat).
    normalize-leetspeak: false
  # Command executed as console when a player triggers the word filter, %player% is
  # replaced with their name. Runs in the background, invisible to the player. Leave
  # empty to disable. Example: "mute %player% 10m Wortfilter" (needs a mute plugin) or
  # simply "warn %player% Please watch your language" (needs a warning plugin).
  punish-command: ""
  # Where the "message blocked" notice is shown to the player. CHAT, ACTIONBAR, TITLE or BOSSBAR.
  notification-type: CHAT
  # Played to the player when their message gets blocked/censored. Any vanilla Minecraft
  # sound name works, see https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
  sound:
    enabled: true
    sound-name: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 1.0

chat-mute:
  # Players/console with this permission can still chat & use commands while muted
  bypass-permission: "stonechat.mute.bypass"
  # If true (default), commands are also blocked while the chat is muted, not just chat itself.
  # Set to false to let players keep using normal commands while only chat is silenced.
  block-commands: true
  # Where the "chat muted/unmuted" broadcast is shown to everyone online. CHAT, ACTIONBAR, TITLE or BOSSBAR.
  notification-type: CHAT
  # Played to everyone online when an admin toggles the mute on/off.
  sound-toggle:
    enabled: true
    sound-name: "BLOCK_ANVIL_LAND"
    volume: 0.6
    pitch: 1.0
  # Played to a player who tries to chat/use a command while the chat is muted.
  sound-blocked:
    enabled: true
    sound-name: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 1.0

link-blocker:
  enabled: true
  bypass-permission: "stonechat.links.bypass"
  patterns:
    - "http://"
    - "https://"
    - "www."
    - ".com"
    - ".net"
    - ".org"
    - ".de"
    - ".gg"
    - ".io"
    - ".to"
  # Command executed as console when a player's link gets blocked, %player% is
  # replaced with their name. Leave empty to disable.
  punish-command: ""
  # Where the "link blocked" notice is shown to the player. CHAT, ACTIONBAR, TITLE or BOSSBAR.
  notification-type: CHAT
  # Played to the player when their link gets blocked.
  sound:
    enabled: true
    sound-name: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 1.0

ping:
  enabled: true
  # Character that triggers a ping, e.g. @PlayerName
  trigger-symbol: "@"
  # Full template for how the mentioned name looks in chat. %player% is replaced with
  # the trigger symbol + player name (e.g. "@Steve"). Supports &-codes, hex and
  # MiniMessage tags (e.g. wrap it in a gradient, add brackets/arrows around it, etc.)
  highlight-template: "<yellow><bold>%player%</bold></yellow>"
  allow-self-ping: false
  # Players with this permission cannot be pinged by others
  immune-permission: "stonechat.ping.immune"
  # If true, players can toggle ignoring pings via /stonechat togglepings
  ignorable: true
  # Where the mentioned player is notified. CHAT, ACTIONBAR, TITLE or BOSSBAR.
  notification-type: CHAT
  sound:
    enabled: true
    sound-name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0

cooldown:
  enabled: true
  chat-seconds: 5
  command-seconds: 3
  bypass-permission: "stonechat.cooldown.bypass"
  # Only these commands (without leading /) are put on cooldown. Leave empty (the
  # default) to cooldown ALL commands. Editable in /sc editor -> Cooldown.
  cooldown-commands: []
  # Where the "please wait" notice is shown. CHAT, ACTIONBAR, TITLE or BOSSBAR.
  notification-type: CHAT
  # Played to the player when they hit a chat/command cooldown.
  sound:
    enabled: true
    sound-name: "BLOCK_NOTE_BLOCK_BASS"
    volume: 0.7
    pitch: 0.8

anti-caps:
  enabled: true
  # Percentage of uppercase letters allowed before action is taken
  max-percentage: 60
  # Messages shorter than this are ignored entirely
  min-length: 5
  # block = message is cancelled, autocorrect = message is lowercased automatically
  mode: block
  bypass-permission: "stonechat.caps.bypass"
  # Command executed as console when a player's message is blocked for excessive
  # caps (not triggered in autocorrect mode), %player% is replaced with their name.
  # Leave empty to disable.
  punish-command: ""
  # Where the "too many caps" notice is shown (not shown in autocorrect mode). CHAT, ACTIONBAR, TITLE or BOSSBAR.
  notification-type: CHAT
  # Played to the player when their message is blocked for excessive caps (not played in autocorrect mode).
  sound:
    enabled: true
    sound-name: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 1.0

join-delay:
  enabled: true
  seconds: 5
  bypass-permission: "stonechat.joindelay.bypass"
  # Where the "please wait" notice is shown. CHAT, ACTIONBAR, TITLE or BOSSBAR.
  notification-type: CHAT
  # Played to the player when they try to chat before the join delay has passed.
  sound:
    enabled: true
    sound-name: "BLOCK_NOTE_BLOCK_BASS"
    volume: 0.7
    pitch: 0.8

max-message-length:
  enabled: true
  max-length: 100
  # Where the "too long" notice is shown. CHAT, ACTIONBAR, TITLE or BOSSBAR.
  notification-type: CHAT
  # Played to the player when their message is blocked for being too long.
  sound:
    enabled: true
    sound-name: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 1.0

# Chat format settings (the whole look of a public chat message, including
# placeholders) live in their own chatformat.yml file, not here.

# Shared title timing, used by /broadcast (type TITLE) as well as by every
# other feature above whose notification-type is set to TITLE.
title-timing:
  fade-in-ticks: 10
  stay-ticks: 60
  fade-out-ticks: 10

broadcast:
  # Which channel the in-game editor shows settings for by default. Purely a UI
  # convenience - /broadcast always still requires you to pick a channel explicitly.
  # CHAT, ACTIONBAR, TITLE or BOSSBAR.
  default-type: CHAT
  # Whether the "[Broadcast]" prefix (text in messages.yml -> broadcast.prefix) is
  # prepended to CHAT-type broadcasts. Has no effect on actionbar/title/bossbar,
  # which don't really have room for a prefix.
  use-prefix: true
  bossbar:
    # Color: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    color: BLUE
    # Style: PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
    style: PROGRESS
    duration-seconds: 10
  # Optional sound played to everyone online whenever /broadcast is used. Disabled by default
  # since broadcasts already have a dedicated channel (chat/actionbar/title/bossbar).
  sound:
    enabled: false
    sound-name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0

# /chatcolor opens a GUI where players pick the color of their own chat
# messages. Every color is a fully independent entry below - add, remove or
# recolor as you like. "color-code" accepts &-codes, &#RRGGBB hex AND
# MiniMessage tags (e.g. gradients), same as everywhere else in this plugin.
# Leave "color-code" empty to make an entry act as a "reset to default" option.
# Give an entry a "permission" to gate it behind a permission node (e.g. so
# only donors can pick red) - leave it empty so everyone can use that color.
chat-color-gui:
  enabled: true
  # Leave empty so every player can open /chat color at all.
  use-permission: ""
